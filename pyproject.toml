[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lanot_ceniza"
version = "0.2.0"
description = "Paquete mínimo instalable para LANOT_ceniza."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "A. Sierra" },
  { name = "Víctor Manuel Jiménez Escudero" }
]
keywords = ["ceniza volcánica", "tephra", "LANOT", "satélite", "detección"]
dependencies = [
  "numpy",
  "skyfield",
  "scipy",
  "xarray",
  "rioxarray",
  "affine",
  "netcdf4",
  "pyproj",
  "python-dateutil",
  "rasterio",
]

[project.optional-dependencies]
pruebas = ["pytest"]
comparacion = ["matplotlib"]  # solo lanot-compare-ash

[project.urls]
Repository = "https://github.com/asierra/LANOT_ceniza"
Issues = "https://github.com/asierra/LANOT_ceniza/issues"

[project.scripts]
lanot-detect-ash = "detect_ash:main"
lanot-compare-ash = "compare_ash:main"

[tool.hatch.build.targets.wheel]
packages = []
include = ["detect_ash.py", "compare_ash.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # nanstd en ventanas sin datos (bordes, fuera del disco): es lo esperado
  "ignore:Degrees of freedom <= 0:RuntimeWarning",
  "ignore:numpy.ndarray size changed:RuntimeWarning",
]
